[project]
name = "formtuist"
version = "0.2.0"
description = "Programmers and agents use formtuist to create and complete forms."
authors = [
    { name = "Gregory M. Kapfhammer", email = "gkapfham@allegheny.edu" }
]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "pydantic>=2.0.0",
    "textual>=1.0.0",
    "textual-serve>=1.1.0",
    "rich>=13.0.0",
    "datasette>=0.64.0",
    "click>=8.0.0",
    "typer>=0.27.0",
    "platformdirs>=4.0.0",
    "bitbang>=0.1.55",
    "textual-timepiece>=0.7.0",
]

[project.scripts]
formtuist = "formtuist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "mypy>=1.11.2,<2",
    "pydocstyle>=6.1.1,<7",
    "pyrefly>=1.0.0",
    "pytest>=8.0.0,<10",
    "pytest-clarity>=1.0.1,<2",
    "pytest-cov>=6.0.0,<7",
    "pytest-randomly>=3.12.0,<4",
    "pytest-sugar>=1.0.0,<2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.15",
    "rumdl>=0.2.4",
    "taskipy>=1.10.1,<2",
    "toml>=0.10.0",
    "trailmark>=0.5.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "ty>=0.0.8",
    "types-pygments>=2.20.0.20260728",
    "types-toml>=0.10.8.20260518",
    "zuban>=0.7.2",
]

[tool.taskipy.settings]
use_vars = true

[tool.taskipy.variables]
project = "src/formtuist"
scripts = "scripts"
tests = "tests"
coveragefailunder = "95"
directtestedfailunder = "40"

[tool.taskipy.tasks]
all = "task check && task test && task test-coverage && task test-coverage-check && task test-coverage-check-trailmark"
check = "task lint && task typecheck"
lint = "task ruff-format && task ruff-check && task vsc && task rumdl-check"
typecheck = "task mypy && task ty && task pyrefly && task zuban"
ruff-check = "ruff check {project} {tests} {scripts}"
ruff-format = "ruff format --check {project} {tests} {scripts}"
format-fix = "ruff format {project} {tests} {scripts}"
rumdl-check = "rumdl check"
rumdl-fix = "rumdl fmt"
mypy = "mypy {project} {scripts}"
ty = "ty check {project} {tests} {scripts}"
pyrefly = "pyrefly check {project} {tests} {scripts}"
zuban = "zuban check {project} {tests} {scripts}"
vsc = { cmd = "uv run -m scripts.vsc check", help = "Check that the formtuist version in version.py matches the version in pyproject.toml" }
vsc-fix = { cmd = "uv run -m scripts.vsc fix", help = "Fix version.py so the formtuist version matches pyproject.toml" }
test = "pytest -x -s -vv"
test-parallel = "pytest -x -s -vv -n auto -p no:sugar"
test-silent = "pytest -x --show-capture=no -n auto"
test-coverage = "pytest -s --cov=formtuist --cov-branch --cov-fail-under={coveragefailunder} --cov-report=term-missing tests/"
test-coverage-check = "uv run python -m scripts.tsc_treesitter --threshold {directtestedfailunder}"
test-coverage-check-trailmark = "uv run python -m scripts.tsc_trailmark --threshold {directtestedfailunder}"
test-coverage-compare = "uv run python -m scripts.tsc_compare tsc-treesitter.json tsc-trailmark.json"
test-propertybased = "pytest -x -s -vv -m propertybased"
test-not-propertybased = "pytest -x -s -vv -m 'not propertybased'"
display = "uv run formtuist display"
serve = "uv run formtuist serve"
publish = "uv run formtuist publish"
check-form = "uv run formtuist check"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "D", "I", "F", "PL", "Q", "RUF", "W", "T201"]
ignore = ["D203", "D213", "E501"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pyrefly]
preset = "legacy"
ignore-missing-imports = ["*"]

[tool.coverage.run]
source = ["formtuist"]
branch = true
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
precision = 2

[tool.pytest.ini_options]
markers = [
    "propertybased: tests using Hypothesis for property-based testing",
]
pythonpath = ["."]
